# Generated from installation.json by scripts/configure-installation.mjs.
# Do not add provider credentials or secret values to this file.
name = "{{WORKER_NAME}}"
account_id = "{{ACCOUNT_ID}}"
main = "src/index.ts"
compatibility_date = "2026-11-02"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "{{D1_DATABASE_NAME}}"
database_id = "{{D1_DATABASE_ID}}"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "MAIL_STORAGE"
id = "{{KV_NAMESPACE_ID}}"

[vars]
APP_NAME = "{{APP_NAME}}"
ENVIRONMENT = "{{ENVIRONMENT}}"
RESEND_REGION = "{{RESEND_REGION}}"
CONTROL_PLANE_URL = "{{CONTROL_PLANE_URL}}"
INSTALLATION_ID = "{{INSTALLATION_ID}}"

[[services]]
binding = "CONTROL_PLANE_SERVICE"
service = "msm-mail-control-plane"

# No per-installation Cron: maintenance is dispatched by the shared control plane.
